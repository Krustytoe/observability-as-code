name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PROMETHEUS_VERSION: "3.15.0"
  JSONNET_VERSION: "0.22.0"
  JB_VERSION: "0.6.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: install promtool, jsonnet, jb
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" && cd "$(mktemp -d)"
          curl -fsSLO "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/sha256sums.txt" | grep linux-amd64.tar.gz | sha256sum -c -
          tar xzf prometheus-*.tar.gz && install -m755 prometheus-*/promtool "$HOME/.local/bin/"
          curl -fsSL "https://github.com/google/go-jsonnet/releases/download/v${JSONNET_VERSION}/go-jsonnet_${JSONNET_VERSION}_linux_amd64.tar.gz" | tar xz
          install -m755 jsonnet jsonnetfmt "$HOME/.local/bin/"
          curl -fsSL -o "$HOME/.local/bin/jb" "https://github.com/jsonnet-bundler/jsonnet-bundler/releases/download/v${JB_VERSION}/jb-linux-amd64"
          chmod +x "$HOME/.local/bin/jb"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: make ci
        run: make ci

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboards
          path: build/dashboards/*.json

  deploy-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate

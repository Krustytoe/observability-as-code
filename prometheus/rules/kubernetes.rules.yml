# Workload-level Kubernetes alerts (kube-state-metrics + kubelet). Cluster-component alerts
# (apiserver, etcd, scheduler) are better sourced from kubernetes-mixin or the managed provider.
groups:
  - name: kubernetes.alerts
    rules:
      - alert: KubePodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is in CrashLoopBackOff"
          runbook_url: "https://github.com/Krustytoe/observability-as-code/blob/main/runbooks/README.md#kubepodcrashlooping"

      - alert: KubeDeploymentReplicasMismatch
        expr: |
          kube_deployment_spec_replicas
            > kube_deployment_status_replicas_available
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.deployment }} is running below desired replicas"
          runbook_url: "https://github.com/Krustytoe/observability-as-code/blob/main/runbooks/README.md#kubedeploymentreplicasmismatch"

      - alert: KubeDeploymentUnavailable
        expr: |
          kube_deployment_spec_replicas > 0
          and
          kube_deployment_status_replicas_available == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has zero available replicas"
          runbook_url: "https://github.com/Krustytoe/observability-as-code/blob/main/runbooks/README.md#kubedeploymentreplicasmismatch"

      - alert: KubePersistentVolumeAlmostFull
        expr: |
          kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has under 5% free"
          runbook_url: "https://github.com/Krustytoe/observability-as-code/blob/main/runbooks/README.md#kubepersistentvolumealmostfull"
